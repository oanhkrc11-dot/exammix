<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hai đồ thị d-t</title>
<style>
body{margin:0;background:#050505;color:white;font-family:Arial}
.wrap{display:flex;height:100vh}
.panel{width:320px;background:#111;padding:15px}
.main{flex:1;padding:15px}
h2{color:#ffd700}
label{display:block;color:#ffd700;margin:8px 0}
input,select{background:#222;color:white;padding:6px;width:100px}
button{width:100%;padding:10px;margin:5px 0;background:#ffd700;border:0;border-radius:8px;font-weight:bold}
.eq{color:#ffd700;font-size:20px}
table{border-collapse:collapse;margin:5px;color:white}
td,th{border:1px solid #777;padding:5px}
svg{background:#000;width:100%;height:80vh;border:1px solid #555}
</style>
</head>
<body>
<div class="wrap">
<div class="panel">
<h2>Hai chuyển động</h2>
<label>d₀₁(m)<input id="d01" value="5"></label>
<label>v₁(m/s)<input id="v1" value="3"></label>
<label>d₀₂(m)<input id="d02" value="20"></label>
<label>v₂(m/s)<input id="v2" value="1"></label>
<label>Bước t(s/ô)<select id="bt"></select></label>
<label>Bước d(m/ô)<select id="bd"></select></label>
<button onclick="create()">Tạo đồ thị</button>
<button onclick="step()">Vẽ từng bước</button>
<button onclick="auto()">Tự động</button>
<button onclick="reset()">Làm lại</button>
</div>
<div class="main">
<div class="eq" id="eq"></div>
<div id="table"></div>
<svg id="svg" viewBox="0 0 800 650"></svg>
</div>
</div>

<script>
for(let i=1;i<=20;i++){bt.innerHTML+=`<option>${i}</option>`;bd.innerHTML+=`<option>${i}</option>`}
let a=[],b=[],n=0,timer;

function create(){
let d01=+document.getElementById('d01').value;
let v1=+document.getElementById('v1').value;
let d02=+document.getElementById('d02').value;
let v2=+document.getElementById('v2').value;
let dt=+bt.value;
eq.innerHTML=`<span style="color:#ffd700">d₁=${d01}${v1>=0?'+':'-'}${Math.abs(v1)}t</span>
&nbsp;&nbsp;&nbsp;
<span style="color:#00bfff">d₂=${d02}${v2>=0?'+':'-'}${Math.abs(v2)}t</span>`;
a=[];b=[];
for(let i=0;i<=10;i++){
let t=i*dt;
a.push({t,d:d01+v1*t});
b.push({t,d:d02+v2*t});
}
n=0;makeTable();draw();
}
function makeTable(){
let s='<table><tr><th colspan="11">t(s)</th>';
a.forEach(x=>s+=`<td>${x.t}</td>`);s+='</tr><tr><th>d₁</th>';
a.forEach(x=>s+=`<td>${x.d}</td>`);s+='</tr><tr><th>d₂</th>';
b.forEach(x=>s+=`<td>${x.d}</td>`);
s+='</tr></table>';
table.innerHTML=s;
}
function draw(){
svg.innerHTML="";
let ox=100,oy=550,size=400,ts=+bt.value,ds=+bd.value;
for(let i=0;i<=10;i++){
let x=ox+i*size/10,y=oy-i*size/10;
svg.innerHTML+=`<line x1="${x}" y1="150" x2="${x}" y2="${oy}" stroke="#333"/>
<line x1="${ox}" y1="${y}" x2="${ox+size}" y2="${y}" stroke="#333"/>
<text x="${x-8}" y="${oy+25}" fill="white">${i*ts}</text>
<text x="55" y="${y+5}" fill="white">${i*ds}</text>`;
}
svg.innerHTML+=`<line x1="100" y1="550" x2="540" y2="550" stroke="white" stroke-width="3"/>
<polygon points="540,550 525,542 525,558" fill="white"/>
<line x1="100" y1="550" x2="100" y2="120" stroke="white" stroke-width="3"/>
<polygon points="100,120 92,135 108,135" fill="white"/>`;

drawLine(a,"#ffd700");
if(n>10)drawLine(b,"#00bfff");

function drawLine(arr,color){
let pts=[];
for(let i=0;i<Math.min(n,arr.length);i++){
let p=arr[i],x=100+p.t/ts*size/10,y=550-p.d/ds*size/10;
pts.push([x,y]);
svg.innerHTML+=`<circle cx="${x}" cy="${y}" r="6" fill="${color}"/>
<line x1="${x}" y1="${y}" x2="${x}" y2="550" stroke="#aaa" stroke-dasharray="5"/>
<line x1="100" y1="${y}" x2="${x}" y2="${y}" stroke="#aaa" stroke-dasharray="5"/>`;
}
if(pts.length>1)svg.innerHTML+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="5"/>`;
}
}
function step(){if(n<20){n++;draw()}}
function auto(){timer=setInterval(()=>{step();if(n>=20)clearInterval(timer)},700)}
function reset(){n=0;draw()}
create();
</script>
</body>
</html>
