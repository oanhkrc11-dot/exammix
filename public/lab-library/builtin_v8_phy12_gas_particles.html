<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mô phỏng phân tử khí nâng cao</title>
<style>
body{margin:0;font-family:Arial;background:#eef3f8;}
canvas{display:block;margin:0 auto;border:1px solid #aaa;background:#ffffff;}
.controls{width:90%;margin:10px auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
button{padding:5px 10px;border:none;border-radius:6px;background:#0f766e;color:white;font-weight:bold;cursor:pointer;}
label{display:flex;align-items:center;gap:5px;}
</style>
</head>
<body>
<div class="controls">
<label>Số phân tử: <input type="range" id="numParticles" min="10" max="200" value="50"></label>
<label>Nhiệt độ (T): <input type="range" id="temp" min="0" max="10" value="5" step="0.1"></label>
<button id="startBtn">Bắt đầu</button>
<button id="pauseBtn">Tạm dừng</button>
<button id="resetBtn">Đặt lại</button>
</div>
<canvas id="canvas" width="900" height="500"></canvas>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const width=canvas.width,height=canvas.height;

let particles=[];
let running=false;

function Particle(temp){
  this.x=Math.random()*(width-50)+25;
  this.y=Math.random()*(height-50)+25;
  const speed=Math.random()*temp+0.5;
  const angle=Math.random()*2*Math.PI;
  this.vx=Math.cos(angle)*speed;
  this.vy=Math.sin(angle)*speed;
  this.color='blue';
  this.speed = speed;
}

function speedToColor(speed){
  // Xanh chậm, đỏ nhanh
  const r=Math.min(255,Math.floor(speed*25));
  const g=50;
  const b=255-r;
  return `rgb(${r},${g},${b})`;
}

function initParticles(num=50,temp=5){
  particles=[];
  for(let i=0;i<num;i++){
    const p=new Particle(temp);
    p.color = speedToColor(p.speed);
    particles.push(p);
  }
}

function update(){
  const tempVal=Number(document.getElementById('temp').value);
  particles.forEach(p=>{
    const speed=Math.random()*tempVal+0.5;
    const angle=Math.atan2(p.vy,p.vx);
    p.vx=Math.cos(angle)*speed;
    p.vy=Math.sin(angle)*speed;
    p.speed = speed;
    p.color = speedToColor(speed);
    p.x+=p.vx; p.y+=p.vy;
    // phản xạ thành hộp
    if(p.x<25) p.x=25,p.vx=Math.abs(p.vx);
    if(p.x>width-25) p.x=width-25,p.vx=-Math.abs(p.vx);
    if(p.y<25) p.y=25,p.vy=Math.abs(p.vy);
    if(p.y>height-25) p.y=height-25,p.vy=-Math.abs(p.vy);
  });
}

function draw(){
  ctx.clearRect(0,0,width,height);
  ctx.strokeStyle='black'; ctx.lineWidth=2;
  ctx.strokeRect(20,20,width-40,height-40);
  particles.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,5,0,2*Math.PI); ctx.fill();
  });
}

function loop(){
  if(running){
    update(); draw(); requestAnimationFrame(loop);
  }
}

document.getElementById('numParticles').addEventListener('input',()=>{
  const num=Number(document.getElementById('numParticles').value);
  const tempVal=Number(document.getElementById('temp').value);
  initParticles(num,tempVal);
  draw();
});

document.getElementById('temp').addEventListener('input',()=>{
  const tempVal=Number(document.getElementById('temp').value);
  particles.forEach(p=>{
    const angle=Math.atan2(p.vy,p.vx);
    const speed=Math.random()*tempVal+0.5;
    p.vx=Math.cos(angle)*speed;
    p.vy=Math.sin(angle)*speed;
    p.speed = speed;
    p.color = speedToColor(speed);
  });
});

document.getElementById('startBtn').addEventListener('click',()=>{ running=true; loop(); });
document.getElementById('pauseBtn').addEventListener('click',()=>{ running=false; });
document.getElementById('resetBtn').addEventListener('click',()=>{
  running=false;
  const num=Number(document.getElementById('numParticles').value);
  const tempVal=Number(document.getElementById('temp').value);
  initParticles(num,tempVal);
  draw();
});

initParticles(50,Number(document.getElementById('temp').value));
draw();
</script>
</body>
</html>
