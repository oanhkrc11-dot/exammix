<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PHYSICS 10 LAB · Phanh xe & thời gian phản ứng</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
:root{
  --bg:#17384f;--panel:#14344d;--card:#123047;--cyan:#74e6ff;--yellow:#ffe47c;
  --green:#93ffd2;--orange:#ffad76;--red:#ff8e8e;--text:#f7fcff;--muted:#bfd4df;--line:rgba(130,230,255,.25)
}
body.light{
  --bg:#dceef7;--panel:#eff8fc;--card:#ffffff;--cyan:#087a9a;--yellow:#8b6900;
  --green:#0b7d53;--orange:#b96531;--red:#b84949;--text:#17384a;--muted:#607d8c;--line:#b3d3e1
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;width:100%;height:100%}
#panel{
  width:282px;min-width:265px;max-width:292px;height:100%;overflow:auto;padding:9px;
  background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 84%,#000 16%));
  border-right:1px solid var(--line);z-index:20
}
body.light #panel{background:linear-gradient(180deg,#f8fcfe,#e4f2f8)}
#view{position:relative;flex:1;height:100%;overflow:hidden;min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.title{font-weight:800;font-size:12.5px}
.kicker{font-size:9px;color:var(--muted);margin-top:2px}
#themeBtn{min-height:28px;width:34px;padding:0}
.simTitle{font-size:14.5px;color:var(--cyan);font-weight:800;margin:7px 0 4px;text-transform:uppercase}
.section{margin-top:6px;padding:7px;border:1px solid var(--line);border-radius:8px;background:color-mix(in srgb,var(--card) 92%,transparent)}
.section h3{margin:0 0 5px;font-size:9.5px;color:var(--cyan);text-transform:uppercase}
.control{margin:6px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:3px}
.row label{font-size:10.2px;font-weight:700}
.value{font-size:10.2px;color:var(--yellow);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:15px;accent-color:#65d9f6}
select{width:100%;height:30px;border:1px solid var(--line);border-radius:7px;background:#17435f;color:white;padding:4px 6px;font-size:10px}
body.light select{background:#f3fbfe;color:#17384a}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}
button{min-height:32px;border:1px solid var(--line);border-radius:7px;padding:5px;background:#17435f;color:#fff;font-weight:700;font-size:10px;cursor:pointer}
body.light button{background:#d9edf5;color:#17384a}
button:hover{filter:brightness(1.08)}
#runBtn{background:#1b7750}
body.light #runBtn{background:#24996a;color:white}
#resetBtn{background:#6a4053}
body.light #resetBtn{background:#e0c5cc;color:#512837}
#info{
  position:absolute;top:12px;right:12px;width:275px;padding:8px 10px;border-radius:10px;
  background:rgba(16,38,56,.86);border:1px solid var(--line);z-index:10;
  backdrop-filter:blur(4px);font-size:10.5px;pointer-events:none
}
body.light #info,#graphWrap,#badge{background:rgba(255,255,255,.91)!important;color:#17384a!important;border-color:#b3d3e1!important}
#info .head{font-size:9.5px;color:var(--cyan);font-weight:800;margin-bottom:4px;text-transform:uppercase}
.infoGrid{display:grid;grid-template-columns:1fr auto;gap:3px 9px;font-variant-numeric:tabular-nums}
#badge{
  position:absolute;left:14px;top:12px;padding:7px 10px;border-radius:9px;background:rgba(18,42,60,.84);
  border:1px solid var(--line);font-size:11px;font-weight:800;color:#effcff;z-index:8
}
#graphWrap{
  position:absolute;left:14px;bottom:40px;width:min(48%,620px);height:215px;
  background:rgba(18,42,60,.84);border:1px solid var(--line);
  border-radius:11px;padding:7px;z-index:8
}
#graph{width:100%;height:100%;display:block}
#credit{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);color:#ffe17a;font-size:15px;font-weight:800;z-index:7;pointer-events:none}
body.light #credit{color:#7a5b00}
.label3d{padding:3px 5px;border-radius:7px;background:rgba(18,40,58,.78);border:1px solid var(--line);font-size:10px;font-weight:700;color:#f5fbff;white-space:nowrap}
body.light .label3d{background:rgba(255,255,255,.90);color:#17384a}
@media(max-width:1000px){#panel{width:258px;min-width:258px}#info{width:235px}#graphWrap{width:44%;height:185px}}
</style>
</head>

<body>
<div id="app">
  <aside id="panel">
    <div class="top">
      <div>
        <div class="title">PHYSICS 10 LAB · 3D CINEMATIC</div>
        <div class="kicker">PHANH XE · AN TOÀN GIAO THÔNG</div>
      </div>
      <button id="themeBtn" title="Sáng/Tối">☀</button>
    </div>

    <div class="simTitle">27–28. Phanh xe & phản ứng</div>

    <div class="section">
      <h3>Chế độ</h3>
      <select id="mode">
        <option value="brake">27. Chỉ xét quãng đường phanh</option>
        <option value="reaction">28. Phản ứng + phanh</option>
      </select>
    </div>

    <div class="section">
      <h3>Thông số</h3>
      <div class="control">
        <div class="row"><label>v₀</label><span class="value" id="v0Text">15.0 m/s</span></div>
        <input id="v0" type="range" min="5" max="30" step="1" value="15">
      </div>
      <div class="control">
        <div class="row"><label>Gia tốc phanh</label><span class="value" id="aText">−5.0 m/s²</span></div>
        <input id="acc" type="range" min="-10" max="-1" step="0.5" value="-5">
      </div>
      <div class="control" id="reactionControl">
        <div class="row"><label>Thời gian phản ứng</label><span class="value" id="trText">0.8 s</span></div>
        <input id="tr" type="range" min="0.2" max="2" step="0.1" value="0.8">
      </div>
    </div>

    <div class="section">
      <h3>Quan sát</h3>
      <select id="cameraMode">
        <option value="all">Toàn cảnh</option>
        <option value="follow">Theo xe</option>
      </select>
      <div class="control">
        <div class="row"><label>Tốc độ mô phỏng</label><span class="value" id="speedText">1.0×</span></div>
        <input id="simSpeed" type="range" min="0.5" max="2" step="0.5" value="1">
      </div>
      <div class="buttons">
        <button id="runBtn">▶ Bắt đầu</button>
        <button id="pauseBtn">⏸ Dừng</button>
        <button id="resetBtn">↻ Đặt lại</button>
        <button id="fitBtn">⛶ Fit</button>
      </div>
    </div>
  </aside>

  <main id="view">
    <div id="badge">Phản ứng → Phanh → Dừng</div>

    <div id="info">
      <div class="head">Số liệu</div>
      <div class="infoGrid">
        <span>Giai đoạn</span><b id="phaseInfo">Chưa chạy</b>
        <span>t</span><b id="tInfo">0.00 s</b>
        <span>v</span><b id="vInfo">15.00 m/s</b>
        <span>x</span><b id="xInfo">0.00 m</b>
        <span>s phản ứng</span><b id="srInfo">0.00 m</b>
        <span>s phanh</span><b id="sbInfo">22.50 m</b>
        <span>s dừng tổng</span><b id="stInfo">34.50 m</b>
      </div>
    </div>

    <div id="graphWrap"><canvas id="graph"></canvas></div>
    <div id="credit">Thầy Hùng vật lí</div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $=id=>document.getElementById(id);
const view=$('view');

const state={
  mode:'brake',
  v0:15,a:-5,tr:.8,
  t:0,simSpeed:1,
  running:false,paused:true,dark:true,cameraMode:'all',
  lastStamp:performance.now()
};

function tBrake(){return state.v0/Math.abs(state.a);}
function sBrake(){return state.v0*state.v0/(2*Math.abs(state.a));}
function sReact(){return state.mode==='reaction'?state.v0*state.tr:0;}
function tStop(){return (state.mode==='reaction'?state.tr:0)+tBrake();}
function sStop(){return sReact()+sBrake();}

function phase(){
  if(state.t<=0)return 'Chưa chạy';
  if(state.mode==='reaction' && state.t<state.tr)return 'Phản ứng';
  if(state.t<tStop())return 'Đang phanh';
  return 'Đã dừng';
}
function vNow(){
  if(state.mode==='reaction' && state.t<state.tr)return state.v0;
  const tb=state.t-(state.mode==='reaction'?state.tr:0);
  if(tb<=0)return state.v0;
  return Math.max(0,state.v0+state.a*tb);
}
function xNow(){
  if(state.mode==='reaction'){
    if(state.t<=state.tr)return state.v0*state.t;
    const tb=Math.min(state.t-state.tr,tBrake());
    return sReact()+state.v0*tb+.5*state.a*tb*tb;
  }else{
    const tb=Math.min(state.t,tBrake());
    return state.v0*tb+.5*state.a*tb*tb;
  }
}
function fmt(n,d=2){return n.toFixed(d).replace('-','−');}

/* scene */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x17384f);
scene.fog=new THREE.Fog(0x17384f,30,85);

const camera=new THREE.PerspectiveCamera(45,view.clientWidth/view.clientHeight,.1,140);
camera.position.set(15,8,16);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(view.clientWidth,view.clientHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
view.prepend(renderer.domElement);

const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(view.clientWidth,view.clientHeight);
labelRenderer.domElement.style.position='absolute';
labelRenderer.domElement.style.inset='0';
labelRenderer.domElement.style.pointerEvents='none';
view.appendChild(labelRenderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.07;
controls.minDistance=7;controls.maxDistance=45;
controls.minPolarAngle=.1;controls.maxPolarAngle=Math.PI*.48;
controls.target.set(10,0,0);

const hemi=new THREE.HemisphereLight(0xe3faff,0x50687a,2.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.0);sun.position.set(10,16,10);sun.castShadow=true;scene.add(sun);

const floorMat=new THREE.MeshPhongMaterial({color:0x2a5069,shininess:20});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(90,20),floorMat);
floor.rotation.x=-Math.PI/2;floor.position.y=-1.6;floor.receiveShadow=true;scene.add(floor);

const roadMat=new THREE.MeshPhongMaterial({color:0x455c6b,shininess:18});
const road=new THREE.Mesh(new THREE.BoxGeometry(80,.18,3.2),roadMat);
road.position.set(15,-.70,0);road.receiveShadow=true;scene.add(road);

for(let x=-22;x<=50;x+=2.4){
  const dash=new THREE.Mesh(new THREE.BoxGeometry(1.05,.025,.07),new THREE.MeshBasicMaterial({color:0xe8e3ba}));
  dash.position.set(x,-.59,0);scene.add(dash);
}

const axis=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-20,.05,-1.15),new THREE.Vector3(50,.05,-1.15)]),
  new THREE.LineBasicMaterial({color:0xc6dde8})
);
scene.add(axis);

for(let x=-20;x<=50;x+=5){
  const tick=new THREE.Mesh(new THREE.BoxGeometry(.025,.35,.025),new THREE.MeshBasicMaterial({color:x===0?0xffdf75:0xa0c5d4}));
  tick.position.set(x,-.125,-1.15);scene.add(tick);
  const d=document.createElement('div');d.className='label3d';d.textContent=x===0?'O':String(x);
  const l=new CSS2DObject(d);l.position.set(x,-.62,-1.15);scene.add(l);
}

/* sedan */
const car=new THREE.Group();scene.add(car);
const carMat=new THREE.MeshPhongMaterial({color:0x3bb8e8,shininess:90});
const lower=new THREE.Mesh(new THREE.BoxGeometry(1.8,.34,.82),carMat);lower.position.y=.35;lower.castShadow=true;car.add(lower);
const hood=new THREE.Mesh(new THREE.BoxGeometry(.62,.18,.76),carMat);hood.position.set(.54,.57,0);car.add(hood);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(.72,.38,.68),new THREE.MeshPhongMaterial({color:0xcfeeff,transparent:true,opacity:.78}));
cabin.position.set(-.07,.73,0);car.add(cabin);

const wheels=[];
for(const sx of [-.6,.6]) for(const sz of [-.4,.4]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.12,24),new THREE.MeshPhongMaterial({color:0x1d2a31}));
  w.rotation.x=Math.PI/2;w.position.set(sx,.14,sz);car.add(w);wheels.push(w);
}
const labelDiv=document.createElement('div');labelDiv.className='label3d';labelDiv.textContent='Xe';
const carLabel=new CSS2DObject(labelDiv);carLabel.position.set(0,1.32,0);car.add(carLabel);

const vArrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(0,1.05,0),1,0x74e6ff,.24,.13);
const aArrow=new THREE.ArrowHelper(new THREE.Vector3(-1,0,0),new THREE.Vector3(0,1.52,0),1,0xffad76,.24,.13);
scene.add(vArrow,aArrow);

/* reaction/brake markers */
const reactLine=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,.12,.65),new THREE.Vector3(0,.12,.65)]),
  new THREE.LineBasicMaterial({color:0xffe47c})
);
scene.add(reactLine);

const brakeLine=new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,.12,-.65),new THREE.Vector3(0,.12,-.65)]),
  new THREE.LineBasicMaterial({color:0xff8e8e})
);
scene.add(brakeLine);

const stopRing=new THREE.Mesh(
  new THREE.RingGeometry(.35,.48,36),
  new THREE.MeshBasicMaterial({color:0x93ffd2,side:THREE.DoubleSide,transparent:true,opacity:.85})
);
stopRing.rotation.x=-Math.PI/2;stopRing.position.y=-.55;scene.add(stopRing);

function updateMarkers(){
  const sr=sReact(),sb=sBrake(),st=sStop();

  reactLine.geometry.dispose();
  reactLine.geometry=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0,.12,.65),
    new THREE.Vector3(sr,.12,.65)
  ]);
  reactLine.visible=state.mode==='reaction';

  brakeLine.geometry.dispose();
  brakeLine.geometry=new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(sr,.12,-.65),
    new THREE.Vector3(sr+sb,.12,-.65)
  ]);

  stopRing.position.x=st;
}

/* graph */
const graph=$('graph'),ctx=graph.getContext('2d');
function resizeGraph(){
  const dpr=Math.min(devicePixelRatio,2),r=graph.getBoundingClientRect();
  graph.width=Math.max(10,Math.floor(r.width*dpr));
  graph.height=Math.max(10,Math.floor(r.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);drawGraph();
}
function graphTheme(){
  return {
    bg:state.dark?'#153047':'#fbfeff',
    grid:state.dark?'rgba(190,230,245,.15)':'rgba(55,95,115,.14)',
    text:state.dark?'#d0e8f1':'#456778'
  };
}
function drawGrid(L,T,w,h){
  const th=graphTheme();
  ctx.strokeStyle=th.grid;ctx.lineWidth=1;
  for(let i=0;i<=5;i++){
    const gx=L+w*i/5;ctx.beginPath();ctx.moveTo(gx,T);ctx.lineTo(gx,T+h);ctx.stroke();
    const gy=T+h*i/5;ctx.beginPath();ctx.moveTo(L,gy);ctx.lineTo(L+w,gy);ctx.stroke();
  }
}
function drawGraph(){
  const W=graph.clientWidth,H=graph.clientHeight,th=graphTheme();
  ctx.clearRect(0,0,W,H);ctx.fillStyle=th.bg;ctx.fillRect(0,0,W,H);

  const mid=H/2;
  const L=42,R=12,w=W-L-R;
  const tmax=Math.max(3,tStop()*1.15);
  const tx=t=>L+t/tmax*w;

  // v-t
  const T=10,h=mid-28;
  drawGrid(L,T,w,h);
  const yv=v=>T+h-(v/(state.v0*1.15))*h;

  // full theoretical
  ctx.globalAlpha=.28;ctx.strokeStyle='#74e6ff';ctx.lineWidth=1.4;
  ctx.beginPath();
  ctx.moveTo(tx(0),yv(state.v0));
  if(state.mode==='reaction'){
    ctx.lineTo(tx(state.tr),yv(state.v0));
  }
  ctx.lineTo(tx(tStop()),yv(0));
  ctx.stroke();ctx.globalAlpha=1;

  // current bold
  ctx.strokeStyle='#74e6ff';ctx.lineWidth=2.4;
  ctx.beginPath();ctx.moveTo(tx(0),yv(state.v0));
  if(state.mode==='reaction'){
    if(state.t<=state.tr)ctx.lineTo(tx(state.t),yv(state.v0));
    else{
      ctx.lineTo(tx(state.tr),yv(state.v0));
      ctx.lineTo(tx(Math.min(state.t,tStop())),yv(vNow()));
    }
  }else{
    ctx.lineTo(tx(Math.min(state.t,tStop())),yv(vNow()));
  }
  ctx.stroke();

  // a-t lower
  const T2=mid+5,h2=H-T2-24;
  drawGrid(L,T2,w,h2);
  const amin=Math.min(state.a*1.25,-1),amax=1;
  const ya=a=>T2+h2-(a-amin)/(amax-amin)*h2;

  ctx.globalAlpha=.28;ctx.strokeStyle='#ffad76';ctx.lineWidth=1.4;
  ctx.beginPath();
  if(state.mode==='reaction'){
    ctx.moveTo(tx(0),ya(0));ctx.lineTo(tx(state.tr),ya(0));
    ctx.lineTo(tx(state.tr),ya(state.a));ctx.lineTo(tx(tStop()),ya(state.a));
  }else{
    ctx.moveTo(tx(0),ya(state.a));ctx.lineTo(tx(tStop()),ya(state.a));
  }
  ctx.stroke();ctx.globalAlpha=1;

  ctx.strokeStyle='#ffad76';ctx.lineWidth=2.3;
  ctx.beginPath();
  if(state.mode==='reaction'){
    if(state.t<=state.tr){
      ctx.moveTo(tx(0),ya(0));ctx.lineTo(tx(state.t),ya(0));
    }else{
      ctx.moveTo(tx(0),ya(0));ctx.lineTo(tx(state.tr),ya(0));
      ctx.moveTo(tx(state.tr),ya(state.a));ctx.lineTo(tx(Math.min(state.t,tStop())),ya(state.a));
    }
  }else{
    ctx.moveTo(tx(0),ya(state.a));ctx.lineTo(tx(Math.min(state.t,tStop())),ya(state.a));
  }
  ctx.stroke();

  // cursor
  const tc=Math.min(state.t,tmax);
  ctx.strokeStyle=th.text;ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(tx(tc),T);ctx.lineTo(tx(tc),T+h);ctx.stroke();
  ctx.beginPath();ctx.moveTo(tx(tc),T2);ctx.lineTo(tx(tc),T2+h2);ctx.stroke();ctx.setLineDash([]);

  ctx.fillStyle=th.text;ctx.font='9px Arial';
  ctx.fillText('v–t',L+4,T+8);ctx.fillText('a–t',L+4,T2+8);

  ctx.textAlign='center';
  for(let i=0;i<=4;i++){
    const tv=tmax*i/4;ctx.fillText(tv.toFixed(1),tx(tv),H-9);
  }
  ctx.fillText('t (s)',L+w/2,H-1);
  ctx.textAlign='left';
}

/* theme */
function applyTheme(){
  document.body.classList.toggle('light',!state.dark);
  $('themeBtn').textContent=state.dark?'☀':'🌙';
  if(state.dark){
    scene.background.set(0x17384f);scene.fog.color.set(0x17384f);
    floorMat.color.set(0x2a5069);roadMat.color.set(0x455c6b);hemi.intensity=2.0;sun.intensity=2.0;
  }else{
    scene.background.set(0xdceef7);scene.fog.color.set(0xdceef7);
    floorMat.color.set(0xc8dde8);roadMat.color.set(0x8b9ea8);hemi.intensity=2.6;sun.intensity=2.4;
  }
  drawGraph();
}
$('themeBtn').addEventListener('click',()=>{state.dark=!state.dark;applyTheme();});

/* ui */
function updateUI(){
  $('v0Text').textContent=`${state.v0.toFixed(1)} m/s`;
  $('aText').textContent=`${fmt(state.a,1)} m/s²`;
  $('trText').textContent=`${state.tr.toFixed(1)} s`;
  $('speedText').textContent=`${state.simSpeed.toFixed(1)}×`;

  $('phaseInfo').textContent=phase();
  $('tInfo').textContent=`${state.t.toFixed(2)} s`;
  $('vInfo').textContent=`${vNow().toFixed(2)} m/s`;
  $('xInfo').textContent=`${xNow().toFixed(2)} m`;
  $('srInfo').textContent=`${sReact().toFixed(2)} m`;
  $('sbInfo').textContent=`${sBrake().toFixed(2)} m`;
  $('stInfo').textContent=`${sStop().toFixed(2)} m`;

  $('reactionControl').style.display=state.mode==='reaction'?'block':'none';
  $('badge').textContent=state.mode==='reaction'
    ? 'Phản ứng → Phanh → Dừng'
    : 'Phanh → Dừng';
}

function update3D(dt){
  const x=xNow(),v=vNow();
  car.position.x=x;
  labelDiv.textContent=`${phase()} · v=${v.toFixed(1)} m/s`;
  wheels.forEach(w=>w.rotation.z-=v*dt*3.0);

  vArrow.position.set(x,1.02,0);
  vArrow.setDirection(new THREE.Vector3(1,0,0));
  vArrow.setLength(Math.max(.001,v*.23),.24,.13);
  vArrow.visible=v>1e-8;

  aArrow.position.set(x,1.52,0);
  const braking=phase()==='Đang phanh';
  aArrow.visible=braking;
  if(braking){
    aArrow.setDirection(new THREE.Vector3(-1,0,0));
    aArrow.setLength(Math.max(.5,Math.abs(state.a)*.35),.24,.13);
  }
}

function fitScene(){
  const center=sStop()/2;
  const span=Math.max(20,sStop()+10);
  controls.target.set(center,0,0);
  camera.position.set(center+span*.32,Math.max(7,span*.18),Math.max(14,span*.42));
  controls.update();
}
function updateCamera(){
  if(state.cameraMode==='follow'){
    const tx=xNow();
    controls.target.x+=(tx-controls.target.x)*.08;
    camera.position.x+=((tx+8)-camera.position.x)*.05;
  }
}

/* events */
$('mode').addEventListener('change',e=>{
  state.mode=e.target.value;state.t=0;state.running=false;state.paused=true;
  updateMarkers();updateUI();drawGraph();fitScene();
});
$('v0').addEventListener('input',e=>{state.v0=parseFloat(e.target.value);state.t=0;updateMarkers();updateUI();drawGraph();fitScene();});
$('acc').addEventListener('input',e=>{state.a=parseFloat(e.target.value);state.t=0;updateMarkers();updateUI();drawGraph();fitScene();});
$('tr').addEventListener('input',e=>{state.tr=parseFloat(e.target.value);state.t=0;updateMarkers();updateUI();drawGraph();fitScene();});
$('simSpeed').addEventListener('input',e=>{state.simSpeed=parseFloat(e.target.value);updateUI();});
$('cameraMode').addEventListener('change',e=>{state.cameraMode=e.target.value;if(state.cameraMode==='all')fitScene();});

$('runBtn').addEventListener('click',()=>{
  if(state.t>=tStop())state.t=0;
  state.running=true;state.paused=false;$('runBtn').textContent='▶ Đang chạy';
});
$('pauseBtn').addEventListener('click',()=>{
  if(!state.running)return;
  state.paused=!state.paused;$('pauseBtn').textContent=state.paused?'▶ Tiếp tục':'⏸ Dừng';
});
$('resetBtn').addEventListener('click',()=>{
  state.t=0;state.running=false;state.paused=true;
  $('runBtn').textContent='▶ Bắt đầu';$('pauseBtn').textContent='⏸ Dừng';
  updateUI();drawGraph();fitScene();
});
$('fitBtn').addEventListener('click',fitScene);

function resize(){
  const w=view.clientWidth,h=view.clientHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();
  renderer.setSize(w,h);labelRenderer.setSize(w,h);resizeGraph();
}
window.addEventListener('resize',resize);

function animate(now){
  requestAnimationFrame(animate);
  let dt=(now-state.lastStamp)/1000;state.lastStamp=now;
  dt=Math.min(Math.max(dt,0),0.028);

  if(state.running&&!state.paused){
    state.t+=dt*state.simSpeed;
    if(state.t>=tStop()){
      state.t=tStop();
      state.running=false;state.paused=true;
      $('runBtn').textContent='▶ Chạy lại';
    }
  }

  update3D(dt);
  updateCamera();
  updateUI();
  drawGraph();

  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}

updateMarkers();
updateUI();
applyTheme();
fitScene();
resize();
animate(performance.now());
</script>
</body>
</html>
