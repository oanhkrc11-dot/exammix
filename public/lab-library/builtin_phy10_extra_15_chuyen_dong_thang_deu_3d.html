<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PHYSICS 10 LAB · Chuyển động thẳng đều</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#10283b;--panel:#14344d;--cyan:#74e6ff;--yellow:#ffe47c;--green:#93ffd2;--text:#f7fcff;--muted:#bfd4df}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;width:100%;height:100%}#panel{width:282px;min-width:265px;max-width:292px;height:100%;overflow:auto;padding:9px;background:linear-gradient(180deg,#173b57,#0f293d);border-right:1px solid rgba(130,230,255,.28);z-index:20}
#view{position:relative;flex:1;height:100%;overflow:hidden;min-width:0}.title{font-weight:800;font-size:12.5px}.kicker{font-size:9px;color:var(--muted);margin-top:2px}.simTitle{font-size:14.5px;color:var(--cyan);font-weight:800;margin:7px 0 4px;text-transform:uppercase}
.section{margin-top:6px;padding:7px;border:1px solid rgba(120,225,255,.18);border-radius:8px;background:rgba(18,48,71,.88)}.section h3{margin:0 0 5px;font-size:9.5px;color:#d0f6ff;text-transform:uppercase}.control{margin:6px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:3px}.row label{font-size:10.2px;font-weight:700}.value{font-size:10.2px;color:var(--yellow);font-variant-numeric:tabular-nums}input[type=range]{width:100%;height:15px;accent-color:#65d9f6}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}button{min-height:32px;border:1px solid rgba(130,225,255,.22);border-radius:7px;padding:5px;background:#17435f;color:#fff;font-weight:700;font-size:10px;cursor:pointer}#runBtn{background:#1b7750}#resetBtn{background:#6a4053}
#info{position:absolute;top:12px;right:12px;width:260px;padding:8px 10px;border-radius:10px;background:rgba(16,38,56,.86);border:1px solid rgba(120,225,255,.30);z-index:10;backdrop-filter:blur(4px);font-size:10.5px;pointer-events:none}.infoGrid{display:grid;grid-template-columns:1fr auto;gap:3px 9px;font-variant-numeric:tabular-nums}.head{font-size:9.5px;color:#d0f6ff;font-weight:800;margin-bottom:4px;text-transform:uppercase}
#credit{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);color:#ffe17a;font-size:15px;font-weight:800;z-index:7;pointer-events:none}.label3d{padding:3px 5px;border-radius:7px;background:rgba(18,40,58,.78);border:1px solid rgba(130,225,255,.24);font-size:10px;font-weight:700;color:#f5fbff;white-space:nowrap}
#equation{position:absolute;left:14px;top:12px;padding:7px 10px;border-radius:9px;background:rgba(18,42,60,.84);border:1px solid rgba(120,225,255,.25);font-size:12px;font-weight:800;color:#effcff;z-index:8}
#graphWrap{position:absolute;left:14px;bottom:40px;width:min(45%,560px);height:210px;background:rgba(18,42,60,.84);border:1px solid rgba(120,225,255,.25);border-radius:11px;padding:7px;z-index:8}#graph{width:100%;height:100%;display:block}
@media(max-width:1000px){#panel{width:258px;min-width:258px}#info{width:225px}#graphWrap{width:42%;height:180px}}
</style></head>
<body><div id="app"><aside id="panel"><div class="title">PHYSICS 10 LAB · 3D CINEMATIC</div><div class="kicker">CHUYỂN ĐỘNG THẲNG</div><div class="simTitle">15. Chuyển động thẳng đều</div>
<div class="section"><h3>Thông số</h3>
<div class="control"><div class="row"><label>x₀</label><span class="value" id="x0Text">−5.0 m</span></div><input id="x0" type="range" min="-10" max="10" step="0.5" value="-5"></div>
<div class="control"><div class="row"><label>v</label><span class="value" id="vText">2.0 m/s</span></div><input id="v" type="range" min="-4" max="4" step="0.1" value="2"></div>
<div class="control"><div class="row"><label>t tối đa</label><span class="value" id="tmaxText">8 s</span></div><input id="tmax" type="range" min="3" max="15" step="1" value="8"></div>
<div class="control"><div class="row"><label>Tốc độ mô phỏng</label><span class="value" id="simSpeedText">1.0×</span></div><input id="simSpeed" type="range" min="0.25" max="2" step="0.25" value="1"></div></div>
<div class="section"><h3>Điều khiển</h3><div class="buttons"><button id="runBtn">▶ Bắt đầu</button><button id="pauseBtn">⏸ Dừng</button><button id="resetBtn">↻ Đặt lại</button><button id="fitBtn">⛶ Fit</button></div></div></aside>
<main id="view"><div id="equation">x = −5.0 + 2.0t</div><div id="info"><div class="head">Số liệu</div><div class="infoGrid"><span>t</span><b id="tInfo">0.00 s</b><span>x</span><b id="xInfo">−5.00 m</b><span>v</span><b id="vInfo">2.00 m/s</b><span>Δx</span><b id="dxInfo">0.00 m</b><span>s</span><b id="sInfo">0.00 m</b></div></div><div id="graphWrap"><canvas id="graph"></canvas></div><div id="credit">Thầy Hùng vật lí</div></main></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{CSS2DRenderer,CSS2DObject}from'three/addons/renderers/CSS2DRenderer.js';
const $=id=>document.getElementById(id),view=$('view'),x0El=$('x0'),vEl=$('v'),tmaxEl=$('tmax'),simSpeedEl=$('simSpeed');
const state={x0:-5,v:2,tMax:8,simSpeed:1,t:0,running:false,paused:true,lastStamp:performance.now()};const xNow=()=>state.x0+state.v*state.t;const fmt=(n,d=1)=>n.toFixed(d).replace('-','−');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x17384f);scene.fog=new THREE.Fog(0x17384f,24,56);
const camera=new THREE.PerspectiveCamera(45,view.clientWidth/view.clientHeight,.1,100);camera.position.set(13,8,15);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(view.clientWidth,view.clientHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;view.prepend(renderer.domElement);
const labelRenderer=new CSS2DRenderer();labelRenderer.setSize(view.clientWidth,view.clientHeight);Object.assign(labelRenderer.domElement.style,{position:'absolute',inset:'0',pointerEvents:'none'});view.appendChild(labelRenderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=7;controls.maxDistance=30;controls.minPolarAngle=.1;controls.maxPolarAngle=Math.PI*.48;controls.target.set(2,0,0);
scene.add(new THREE.HemisphereLight(0xe3faff,0x50687a,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(9,16,10);sun.castShadow=true;scene.add(sun);const fill=new THREE.PointLight(0x8cecff,26,35,2);fill.position.set(-8,7,8);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(42,18),new THREE.MeshPhongMaterial({color:0x2a5069,shininess:24}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.6;floor.receiveShadow=true;scene.add(floor);
const road=new THREE.Mesh(new THREE.BoxGeometry(34,.16,2),new THREE.MeshPhongMaterial({color:0x455c6b,shininess:18}));road.position.y=-.7;road.receiveShadow=true;scene.add(road);
const grid=new THREE.GridHelper(42,42,0x8bd4ef,0x496f84);grid.position.y=-1.58;grid.material.transparent=true;grid.material.opacity=.32;scene.add(grid);
const axis=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-15,.06,0),new THREE.Vector3(15,.06,0)]),new THREE.LineBasicMaterial({color:0xd7edf6}));scene.add(axis);
for(let x=-14;x<=14;x++){const h=x===0?.46:.26,t=new THREE.Mesh(new THREE.BoxGeometry(.025,h,.025),new THREE.MeshBasicMaterial({color:x===0?0xffe17a:0x9bc8d9}));t.position.set(x,-h/2+.06,0);scene.add(t);if(x%2===0){const d=document.createElement('div');d.className='label3d';d.textContent=String(x);const l=new CSS2DObject(d);l.position.set(x,-.55,0);scene.add(l)}}
const car=new THREE.Group();scene.add(car);const carBody=new THREE.Mesh(new THREE.BoxGeometry(1.25,.46,.82),new THREE.MeshPhongMaterial({color:0x4fd2ff,emissive:0x0a435d,shininess:110}));carBody.position.y=.4;carBody.castShadow=true;car.add(carBody);const cabin=new THREE.Mesh(new THREE.BoxGeometry(.48,.29,.68),new THREE.MeshPhongMaterial({color:0xe3f9ff,transparent:true,opacity:.84}));cabin.position.set(.1,.74,0);car.add(cabin);
function wheel(x,z){const w=new THREE.Mesh(new THREE.CylinderGeometry(.15,.15,.12,22),new THREE.MeshPhongMaterial({color:0x18252f}));w.rotation.x=Math.PI/2;w.position.set(x,.15,z);return w}car.add(wheel(-.38,.36),wheel(.38,.36),wheel(-.38,-.36),wheel(.38,-.36));
const carLabelDiv=document.createElement('div');carLabelDiv.className='label3d';const carLabel=new CSS2DObject(carLabelDiv);carLabel.position.set(0,1.25,0);car.add(carLabel);
const velArrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(0,.95,0),1.2,0x93ffd2,.24,.14);scene.add(velArrow);let trail=null;
function rebuildTrail(){if(trail){scene.remove(trail);trail.geometry.dispose();trail.material.dispose()}trail=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(state.x0,.12,.55),new THREE.Vector3(xNow(),.12,.55)]),new THREE.LineBasicMaterial({color:0xffe17a}));scene.add(trail)}
function update3D(){const x=xNow();car.position.x=x;carLabelDiv.textContent=`x = ${fmt(x,1)} m`;const dir=Math.sign(state.v)||1;velArrow.setDirection(new THREE.Vector3(dir,0,0));velArrow.setLength(Math.max(.001,Math.abs(state.v)*.65),.24,.14);velArrow.position.set(x,.92,0);velArrow.visible=Math.abs(state.v)>1e-8;rebuildTrail()}
const graph=$('graph'),ctx=graph.getContext('2d');function resizeGraph(){const dpr=Math.min(devicePixelRatio,2),r=graph.getBoundingClientRect();graph.width=Math.max(10,Math.floor(r.width*dpr));graph.height=Math.max(10,Math.floor(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);drawGraph()}
function drawGraph(){const W=graph.clientWidth,H=graph.clientHeight;ctx.clearRect(0,0,W,H);ctx.fillStyle='#153047';ctx.fillRect(0,0,W,H);const L=40,R=12,T=12,B=28,w=W-L-R,h=H-T-B,xEnd=state.x0+state.v*state.tMax;let xmin=Math.min(state.x0,xEnd),xmax=Math.max(state.x0,xEnd);if(Math.abs(xmax-xmin)<.2){xmin-=2;xmax+=2}else{const p=(xmax-xmin)*.12;xmin-=p;xmax+=p}const tx=t=>L+t/state.tMax*w,xy=x=>T+h-(x-xmin)/(xmax-xmin)*h;ctx.strokeStyle='rgba(190,230,245,.15)';for(let i=0;i<=5;i++){const gx=L+w*i/5;ctx.beginPath();ctx.moveTo(gx,T);ctx.lineTo(gx,T+h);ctx.stroke();const gy=T+h*i/5;ctx.beginPath();ctx.moveTo(L,gy);ctx.lineTo(L+w,gy);ctx.stroke()}ctx.strokeStyle='rgba(116,230,255,.28)';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(tx(0),xy(state.x0));ctx.lineTo(tx(state.tMax),xy(xEnd));ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#74e6ff';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(tx(0),xy(state.x0));ctx.lineTo(tx(state.t),xy(xNow()));ctx.stroke();ctx.fillStyle='#ffe47c';ctx.beginPath();ctx.arc(tx(state.t),xy(xNow()),4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d0e8f1';ctx.font='10px Arial';ctx.textAlign='center';for(let i=0;i<=4;i++){const tt=state.tMax*i/4;ctx.fillText(tt.toFixed(1),tx(tt),H-10)}ctx.fillText('t (s)',L+w/2,H-1);ctx.textAlign='right';for(let i=0;i<=4;i++){const xv=xmax-(xmax-xmin)*i/4;ctx.fillText(xv.toFixed(1),L-5,T+h*i/4+3)}ctx.save();ctx.translate(10,T+h/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('x (m)',0,0);ctx.restore()}
function updateUI(){const x=xNow(),dx=x-state.x0,s=Math.abs(dx);$('x0Text').textContent=`${fmt(state.x0,1)} m`;$('vText').textContent=`${fmt(state.v,1)} m/s`;$('tmaxText').textContent=`${state.tMax.toFixed(0)} s`;$('simSpeedText').textContent=`${state.simSpeed.toFixed(2).replace(/0$/,'')}×`;$('tInfo').textContent=`${state.t.toFixed(2)} s`;$('xInfo').textContent=`${fmt(x,2)} m`;$('vInfo').textContent=`${fmt(state.v,2)} m/s`;$('dxInfo').textContent=`${fmt(dx,2)} m`;$('sInfo').textContent=`${s.toFixed(2)} m`;$('equation').textContent=`x = ${fmt(state.x0,1)} ${state.v>=0?'+':'−'} ${Math.abs(state.v).toFixed(1)}t`}
function refresh(){update3D();updateUI();drawGraph()}
x0El.addEventListener('input',()=>{state.x0=parseFloat(x0El.value);state.t=0;state.running=false;state.paused=true;refresh()});vEl.addEventListener('input',()=>{state.v=parseFloat(vEl.value);state.t=0;state.running=false;state.paused=true;refresh()});tmaxEl.addEventListener('input',()=>{state.tMax=parseFloat(tmaxEl.value);if(state.t>state.tMax)state.t=state.tMax;refresh()});simSpeedEl.addEventListener('input',()=>{state.simSpeed=parseFloat(simSpeedEl.value);updateUI()});
$('runBtn').addEventListener('click',()=>{if(state.t>=state.tMax)state.t=0;state.running=true;state.paused=false;$('runBtn').textContent='▶ Đang chạy'});$('pauseBtn').addEventListener('click',()=>{if(!state.running)return;state.paused=!state.paused;$('pauseBtn').textContent=state.paused?'▶ Tiếp tục':'⏸ Dừng'});$('resetBtn').addEventListener('click',resetAll);$('fitBtn').addEventListener('click',fitScene);
function fitScene(){camera.position.set(13,8,15);controls.target.set(2,0,0);controls.update()}function resetAll(){x0El.value='-5';vEl.value='2';tmaxEl.value='8';simSpeedEl.value='1';Object.assign(state,{x0:-5,v:2,tMax:8,simSpeed:1,t:0,running:false,paused:true});$('runBtn').textContent='▶ Bắt đầu';$('pauseBtn').textContent='⏸ Dừng';refresh();fitScene()}function resize(){const w=view.clientWidth,h=view.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);labelRenderer.setSize(w,h);resizeGraph()}window.addEventListener('resize',resize);
function animate(now){requestAnimationFrame(animate);let dt=(now-state.lastStamp)/1000;state.lastStamp=now;dt=Math.min(Math.max(dt,0),0.028);if(state.running&&!state.paused){state.t+=dt*state.simSpeed;if(state.t>=state.tMax){state.t=state.tMax;state.running=false;state.paused=true;$('runBtn').textContent='▶ Chạy lại'}refresh()}controls.update();renderer.render(scene,camera);labelRenderer.render(scene,camera)}resetAll();resize();animate(performance.now());
</script></body></html>
