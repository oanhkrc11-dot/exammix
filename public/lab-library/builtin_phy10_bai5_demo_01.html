(()=>{'use strict';const $=id=>document.getElementById(id),C=$('view'),c=C.getContext('2d');const PI=Math.PI,cl=(x,a,b)=>Math.max(a,Math.min(b,x));let W=900,H=600,device=1,last=performance.now(),rec=null,chunks=[];const S={mode:'compare',vA:12,vB:8,L:120,t:0,run:false,paused:false,rate:1,yaw:.22,pitch:.20,zoom:1,cam:false,follow:0,vectors:true,grid:true,hud:true};

function data(){const L=S.L,a=S.vA,b=S.mode==='opposite'?S.vA:S.vB,t=S.t;let A={x:0,dx:0,s:0,v:0,face:1},B={x:0,dx:0,s:0,v:0,face:1},duration=0;if(S.mode==='return'){let t1=L/a,t2=L/b;duration=t1+t2;let go=Math.min(t,t1);let back=cl(t-t1,0,t2);A.x=a*go-b*back;A.dx=A.x;A.s=a*go+b*back;A.v=t<=t1?a:(t<duration?-b:0);A.face=t<t1?1:-1}else{duration=L/Math.max(a,b);A.x=Math.min(L,a*t);A.dx=A.x;A.s=A.x;A.v=t<duration?a:0;A.face=1;B.x=(S.mode==='opposite'?L-Math.min(L,b*t):Math.min(L,b*t));B.dx=S.mode==='opposite'?B.x-L:B.x;B.s=Math.min(L,b*t);B.v=t<duration?(S.mode==='opposite'?-b:b):0;B.face=S.mode==='opposite'?-1:1}return {A,B,duration}}
