<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PHYSICS 10 LAB · Đồ thị quãng đường – thời gian</title>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
:root{
  --bg:#081522;--panel:#102638;--cyan:#71e3ff;--yellow:#ffe17a;
  --green:#91ffd0;--red:#ff9a9a;--text:#f5fbff;--muted:#b8cedb;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;width:100%;height:100%}
#panel{
  width:282px;min-width:265px;max-width:292px;height:100%;overflow:auto;padding:9px;
  background:linear-gradient(180deg,#143048,#0c2031);
  border-right:1px solid rgba(130,230,255,.28);z-index:20
}
#view{position:relative;flex:1;height:100%;overflow:hidden;min-width:0}
.title{font-weight:800;font-size:12.5px;letter-spacing:.035em}
.kicker{font-size:9px;color:var(--muted);margin-top:2px}
.simTitle{font-size:14.5px;color:var(--cyan);font-weight:800;margin:7px 0 4px;text-transform:uppercase}
.section{margin-top:6px;padding:7px;border:1px solid rgba(120,225,255,.18);border-radius:8px;background:rgba(18,48,71,.88)}
.section h3{margin:0 0 5px;font-size:9.5px;color:#c7f3ff;text-transform:uppercase;letter-spacing:.05em}
.control{margin:6px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:3px}
.row label{font-size:10.2px;font-weight:700}
.value{font-size:10.2px;color:var(--yellow);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:15px;accent-color:#65d9f6}
.check{display:flex;align-items:center;gap:5px;font-size:10px;margin:4px 0}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}
button{min-height:32px;border:1px solid rgba(130,225,255,.22);border-radius:7px;padding:5px;background:#17435f;color:#fff;font-weight:700;font-size:10px;cursor:pointer}
button:hover{filter:brightness(1.08)}
#runBtn{background:#1b7750}
#resetBtn{background:#6a4053}
#info{
  position:absolute;top:12px;right:12px;width:250px;padding:8px 10px;border-radius:10px;
  background:rgba(16,38,56,.86);border:1px solid rgba(120,225,255,.30);z-index:10;
  backdrop-filter:blur(4px);font-size:10.5px;pointer-events:none
}
#info .head{font-size:9.5px;color:#d0f6ff;font-weight:800;margin-bottom:4px;text-transform:uppercase}
.infoGrid{display:grid;grid-template-columns:1fr auto;gap:3px 9px;font-variant-numeric:tabular-nums}
#credit{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);color:#ffe17a;font-size:15px;font-weight:800;z-index:7;pointer-events:none}
#graphWrap{
  position:absolute;left:14px;bottom:38px;width:min(46%,590px);height:220px;
  background:rgba(18,42,60,.86);border:1px solid rgba(120,225,255,.28);border-radius:11px;
  padding:7px;z-index:9;backdrop-filter:blur(4px)
}
#graph{width:100%;height:100%;display:block}
.label3d{padding:3px 5px;border-radius:7px;background:rgba(18,40,58,.78);border:1px solid rgba(130,225,255,.24);font-size:10px;font-weight:700;color:#f5fbff;white-space:nowrap}
#modeBadge{
  position:absolute;left:14px;top:12px;padding:7px 10px;border-radius:9px;background:rgba(18,42,60,.84);
  border:1px solid rgba(120,225,255,.25);font-size:11px;font-weight:800;color:#e8fbff;z-index:8
}
@media(max-width:1000px){
  #panel{width:258px;min-width:258px}
  #info{width:225px}
  #graphWrap{width:43%;height:185px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <div class="title">PHYSICS 10 LAB · 3D CINEMATIC</div>
    <div class="kicker">CHUYỂN ĐỘNG</div>
    <div class="simTitle">10. Quãng đường – thời gian</div>

    <div class="section">
      <h3>Thông số</h3>
      <div class="control">
        <div class="row"><label>Vận tốc</label><span class="value" id="vText">2.0 m/s</span></div>
        <input id="vSlider" type="range" min="0.5" max="4.0" step="0.1" value="2.0">
      </div>
      <div class="control">
        <div class="row"><label>Thời gian</label><span class="value" id="tText">8 s</span></div>
        <input id="tSlider" type="range" min="4" max="15" step="1" value="8">
      </div>
      <div class="control">
        <div class="row"><label>Tốc độ chạy</label><span class="value" id="speedText">1.0×</span></div>
        <input id="speedSlider" type="range" min="0.25" max="2" step="0.25" value="1">
      </div>
      <div class="check"><input id="showTrail" type="checkbox" checked><label for="showTrail">Hiện quãng đường đã đi</label></div>
      <div class="check"><input id="showVector" type="checkbox" checked><label for="showVector">Hiện vận tốc</label></div>
    </div>

    <div class="section">
      <h3>Điều khiển</h3>
      <div class="buttons">
        <button id="runBtn">▶ Bắt đầu</button>
        <button id="pauseBtn">⏸ Dừng</button>
        <button id="resetBtn">↻ Đặt lại</button>
        <button id="fitBtn">⛶ Fit</button>
      </div>
    </div>
  </aside>

  <main id="view">
    <div id="modeBadge">s = vt</div>

    <div id="info">
      <div class="head">Số liệu</div>
      <div class="infoGrid">
        <span>t</span><b id="timeInfo">0.00 s</b>
        <span>s</span><b id="sInfo">0.00 m</b>
        <span>v</span><b id="vInfo">2.00 m/s</b>
        <span>Độ dốc</span><b id="slopeInfo">2.00 m/s</b>
      </div>
    </div>

    <div id="graphWrap"><canvas id="graph"></canvas></div>
    <div id="credit">Thầy Hùng vật lí</div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $=id=>document.getElementById(id);
const view=$('view');
const vSlider=$('vSlider'),tSlider=$('tSlider'),speedSlider=$('speedSlider');
const showTrail=$('showTrail'),showVector=$('showVector');

const state={
  v:2,
  tMax:8,
  simSpeed:1,
  t:0,
  running:false,
  paused:true,
  lastStamp:performance.now()
};

function sNow(){return state.v*state.t;}

/* SCENE */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x13283a);
scene.fog=new THREE.Fog(0x13283a,24,58);

const camera=new THREE.PerspectiveCamera(45,view.clientWidth/view.clientHeight,.1,120);
camera.position.set(13,8,16);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(view.clientWidth,view.clientHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
view.prepend(renderer.domElement);

const labelRenderer=new CSS2DRenderer();
labelRenderer.setSize(view.clientWidth,view.clientHeight);
labelRenderer.domElement.style.position='absolute';
labelRenderer.domElement.style.inset='0';
labelRenderer.domElement.style.pointerEvents='none';
view.appendChild(labelRenderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.07;
controls.minDistance=7;
controls.maxDistance=34;
controls.minPolarAngle=.08;
controls.maxPolarAngle=Math.PI*.48;
controls.target.set(2,0,0);

/* brighter lights */
scene.add(new THREE.HemisphereLight(0xd8f4ff,0x496174,2.0));
const sun=new THREE.DirectionalLight(0xffffff,2.1);
sun.position.set(8,16,10);
sun.castShadow=true;
scene.add(sun);
const fill=new THREE.PointLight(0x8ce9ff,35,35,2);
fill.position.set(-8,7,7);scene.add(fill);
const warm=new THREE.PointLight(0xffe3a3,20,28,2);
warm.position.set(8,5,-6);scene.add(warm);

const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(50,22),
  new THREE.MeshPhongMaterial({color:0x254057,shininess:35})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-1.7;
floor.receiveShadow=true;
scene.add(floor);

const grid=new THREE.GridHelper(50,50,0x6bb2d1,0x365a72);
grid.position.y=-1.68;
grid.material.transparent=true;
grid.material.opacity=.34;
scene.add(grid);

/* road */
const road=new THREE.Mesh(
  new THREE.BoxGeometry(36,.18,2.5),
  new THREE.MeshPhongMaterial({color:0x3e5262,shininess:18})
);
road.position.set(0,-.75,0);
road.receiveShadow=true;
scene.add(road);

for(let i=-15;i<=15;i+=2.3){
  const dash=new THREE.Mesh(
    new THREE.BoxGeometry(1.1,.025,.08),
    new THREE.MeshBasicMaterial({color:0xf6efc4})
  );
  dash.position.set(i,-.64,0);
  scene.add(dash);
}

/* start gate */
const gate=new THREE.Group();scene.add(gate);
const poleMat=new THREE.MeshPhongMaterial({color:0x8ce7ff,emissive:0x123c4d});
const p1=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1.7,12),poleMat);
p1.position.set(0,.05,-1.0);
const p2=p1.clone();p2.position.z=1.0;
const top=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,2.05),poleMat);
top.position.set(0,.85,0);
gate.add(p1,p2,top);

const gateLabelDiv=document.createElement('div');
gateLabelDiv.className='label3d';
gateLabelDiv.textContent='O';
const gateLabel=new CSS2DObject(gateLabelDiv);
gateLabel.position.set(0,1.35,0);gate.add(gateLabel);

/* car */
const car=new THREE.Group();scene.add(car);
const body=new THREE.Mesh(
  new THREE.BoxGeometry(1.35,.46,.88),
  new THREE.MeshPhongMaterial({color:0x47c9ff,emissive:0x0a445f,shininess:120})
);
body.position.y=.42;body.castShadow=true;car.add(body);

const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(.52,.30,.72),
  new THREE.MeshPhongMaterial({color:0xe1f8ff,transparent:true,opacity:.86,shininess:100})
);
cabin.position.set(.08,.78,0);car.add(cabin);

function wheel(x,z){
  const w=new THREE.Mesh(
    new THREE.CylinderGeometry(.16,.16,.12,24),
    new THREE.MeshPhongMaterial({color:0x17232c,shininess:40})
  );
  w.rotation.x=Math.PI/2;
  w.position.set(x,.16,z);
  return w;
}
car.add(wheel(-.42,.39),wheel(.42,.39),wheel(-.42,-.39),wheel(.42,-.39));

const carLabelDiv=document.createElement('div');
carLabelDiv.className='label3d';
carLabelDiv.textContent='s = 0.00 m';
const carLabel=new CSS2DObject(carLabelDiv);
carLabel.position.set(0,1.28,0);car.add(carLabel);

/* velocity arrow */
const velocityArrow=new THREE.ArrowHelper(
  new THREE.Vector3(1,0,0),
  new THREE.Vector3(0,1.08,0),
  1.5,0x91ffd0,.28,.16
);
scene.add(velocityArrow);

/* trail */
const trailMat=new THREE.LineBasicMaterial({color:0xffe17a});
let trail=null;
function rebuildTrail(){
  if(trail){
    scene.remove(trail);
    trail.geometry.dispose();
    trail=null;
  }
  if(!showTrail.checked)return;
  const pts=[
    new THREE.Vector3(0,-.58,.82),
    new THREE.Vector3(sNow(),-.58,.82)
  ];
  trail=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),trailMat.clone());
  scene.add(trail);
}

/* endpoint marker moving with car */
const endpoint=new THREE.Mesh(
  new THREE.SphereGeometry(.10,18,14),
  new THREE.MeshPhongMaterial({color:0xffe17a,emissive:0x5a4712})
);
scene.add(endpoint);

function update3D(){
  const s=sNow();
  car.position.x=s;
  carLabelDiv.textContent=`s = ${s.toFixed(2)} m`;
  velocityArrow.position.set(s,.95,0);
  velocityArrow.setLength(Math.max(.8,state.v*.65),.25,.14);
  velocityArrow.visible=showVector.checked;

  endpoint.position.set(s,-.57,.82);
  endpoint.visible=showTrail.checked;
  rebuildTrail();
}

/* GRAPH */
const graph=$('graph'),ctx=graph.getContext('2d');

function resizeGraph(){
  const dpr=Math.min(devicePixelRatio,2),r=graph.getBoundingClientRect();
  graph.width=Math.max(10,Math.floor(r.width*dpr));
  graph.height=Math.max(10,Math.floor(r.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawGraph();
}

function drawGraph(){
  const W=graph.clientWidth,H=graph.clientHeight;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#153047';ctx.fillRect(0,0,W,H);

  const L=40,R=12,T=12,B=28,w=W-L-R,h=H-T-B;
  const sMax=Math.max(1,state.v*state.tMax);

  const tx=t=>L+t/state.tMax*w;
  const sy=s=>T+h-s/sMax*h;

  ctx.strokeStyle='rgba(190,230,245,.15)';
  ctx.lineWidth=1;
  for(let i=0;i<=5;i++){
    const x=L+w*i/5;ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,T+h);ctx.stroke();
    const y=T+h*i/5;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(L+w,y);ctx.stroke();
  }

  ctx.strokeStyle='rgba(113,227,255,.28)';
  ctx.setLineDash([5,4]);
  ctx.beginPath();ctx.moveTo(tx(0),sy(0));ctx.lineTo(tx(state.tMax),sy(sMax));ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle='#71e3ff';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(tx(0),sy(0));ctx.lineTo(tx(state.t),sy(sNow()));ctx.stroke();

  ctx.fillStyle='#ffe17a';
  ctx.beginPath();ctx.arc(tx(state.t),sy(sNow()),4,0,Math.PI*2);ctx.fill();

  ctx.fillStyle='#d0e8f1';ctx.font='10px Arial';
  ctx.textAlign='center';
  for(let i=0;i<=4;i++){
    const t=state.tMax*i/4;
    ctx.fillText(t.toFixed(1),tx(t),H-10);
  }
  ctx.fillText('t (s)',L+w/2,H-1);

  ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    const sv=sMax*(1-i/4);
    ctx.fillText(sv.toFixed(1),L-5,T+h*i/4+3);
  }
  ctx.save();
  ctx.translate(10,T+h/2);
  ctx.rotate(-Math.PI/2);
  ctx.textAlign='center';
  ctx.fillText('s (m)',0,0);
  ctx.restore();
}

/* UI */
function updateUI(){
  $('vText').textContent=`${state.v.toFixed(1)} m/s`;
  $('tText').textContent=`${state.tMax.toFixed(0)} s`;
  $('speedText').textContent=`${state.simSpeed.toFixed(2).replace(/0$/,'')}×`;

  $('timeInfo').textContent=`${state.t.toFixed(2)} s`;
  $('sInfo').textContent=`${sNow().toFixed(2)} m`;
  $('vInfo').textContent=`${state.v.toFixed(2)} m/s`;
  $('slopeInfo').textContent=`${state.v.toFixed(2)} m/s`;
  $('modeBadge').textContent=`s = ${state.v.toFixed(1)}t`;
}

function refresh(){update3D();updateUI();drawGraph();}

/* EVENTS */
vSlider.addEventListener('input',()=>{
  state.v=parseFloat(vSlider.value);
  state.t=0;state.running=false;state.paused=true;
  refresh();
});
tSlider.addEventListener('input',()=>{
  state.tMax=parseFloat(tSlider.value);
  if(state.t>state.tMax)state.t=state.tMax;
  refresh();
});
speedSlider.addEventListener('input',()=>{
  state.simSpeed=parseFloat(speedSlider.value);updateUI();
});
showTrail.addEventListener('change',update3D);
showVector.addEventListener('change',update3D);

$('runBtn').addEventListener('click',()=>{
  if(state.t>=state.tMax)state.t=0;
  state.running=true;state.paused=false;
  $('runBtn').textContent='▶ Đang chạy';
});
$('pauseBtn').addEventListener('click',()=>{
  if(!state.running)return;
  state.paused=!state.paused;
  $('pauseBtn').textContent=state.paused?'▶ Tiếp tục':'⏸ Dừng';
});
$('resetBtn').addEventListener('click',resetAll);
$('fitBtn').addEventListener('click',fitScene);

function fitScene(){
  camera.position.set(13,8,16);
  controls.target.set(4,0,0);
  controls.update();
}
function resetAll(){
  vSlider.value='2.0';
  tSlider.value='8';
  speedSlider.value='1';
  showTrail.checked=true;
  showVector.checked=true;

  state.v=2;
  state.tMax=8;
  state.simSpeed=1;
  state.t=0;
  state.running=false;
  state.paused=true;

  $('runBtn').textContent='▶ Bắt đầu';
  $('pauseBtn').textContent='⏸ Dừng';
  refresh();
  fitScene();
}
function resize(){
  const w=view.clientWidth,h=view.clientHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();
  renderer.setSize(w,h);labelRenderer.setSize(w,h);resizeGraph();
}
window.addEventListener('resize',resize);

/* ANIMATION */
function animate(now){
  requestAnimationFrame(animate);
  let dt=(now-state.lastStamp)/1000;
  state.lastStamp=now;
  dt=Math.min(Math.max(dt,0),0.028);

  if(state.running && !state.paused){
    state.t+=dt*state.simSpeed;
    if(state.t>=state.tMax){
      state.t=state.tMax;
      state.running=false;
      state.paused=true;
      $('runBtn').textContent='▶ Chạy lại';
      $('pauseBtn').textContent='⏸ Dừng';
    }
    refresh();
  }

  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}

resetAll();
resize();
animate(performance.now());
</script>
</body>
</html>
